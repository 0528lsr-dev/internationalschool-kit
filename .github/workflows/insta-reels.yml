# 국제학교튜터 → 인스타 릴스 자동 게시 (sns/insta-reel.py)
# 비밀값: INSTA_TOKEN(비즈니스 포트폴리오 시스템 사용자 토큰, 만료 없음)
# 손으로 돌릴 때 dry=1 이면 영상만 만들어 결과물(reel)로 남기고 올리지 않는다.
name: 인스타 릴스 자동 게시
on:
  # 예약 시간은 scheduler.yml(SNS 시간표)이 관리한다 — 여기서는 직접 예약하지 않는다 (2026-11-11)
  # 하루 한 번만 보낸다(저장소 변수 REEL_SENT_DATE) — 여러 번 실행돼도 두 번 보내지 않는다.
  workflow_dispatch:
    inputs:
      dry:
        description: '1 이면 영상만 만들고 올리지 않음'
        default: '0'
      force:
        description: '1 이면 오늘 이미 보냈어도 다시 보냄'
        default: '0'
jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -q pillow
          which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - run: python sns/insta-reel.py
        env:
          INSTA_TOKEN: ${{ secrets.INSTA_TOKEN }}
          DRY: ${{ github.event.inputs.dry }}
          MODE: telegram            # 반자동: 텔레그램으로 영상 보내기 (완전 자동으로 바꾸려면 이 줄 삭제)
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CONTENT_CHAT }}
          SENT_DATE: ${{ vars.REEL_SENT_DATE }}
          FORCE: ${{ github.event.inputs.force }}
      - name: 오늘 보냈다고 기록
        if: always()
        run: if [ -s "$RUNNER_TEMP/sent_date" ]; then gh variable set REEL_SENT_DATE --repo "$GITHUB_REPOSITORY" --body "$(cat $RUNNER_TEMP/sent_date)"; fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel
          path: |
            out/reel.mp4
            out/s*.png
            out/caption.txt
          retention-days: 7
