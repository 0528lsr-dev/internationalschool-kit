# 네이버 블로그 초안(sns/blog/*.md, 매일 13시 클라우드 루틴이 작성) → 텔레그램 (sns/blog-send.py)
name: 네이버 블로그 초안 보내기
on:
  push:
    paths:
      - 'sns/blog/*.md'
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python sns/blog-send.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
