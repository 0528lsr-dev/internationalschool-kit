# 국제학교튜터 스레드 새 댓글 → 텔레그램 알림 (sns/threads-replies.mjs)
name: 스레드·인스타 댓글 알림
on:
  schedule:
    - cron: '17 * * * *'   # 1시간마다 (빠진 시간이 있어도 '지난번 확인 이후' 댓글을 모두 보낸다 — 변수 LAST_REPLY_CHECK)
    - cron: '47 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node sns/threads-replies.mjs
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          INSTA_TOKEN: ${{ secrets.INSTA_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CONTENT_CHAT }}
          LAST_CHECK: ${{ vars.LAST_REPLY_CHECK }}
      - name: 확인한 시각 기록
        if: success()
        run: if [ -s "$RUNNER_TEMP/last_check" ]; then gh variable set LAST_REPLY_CHECK --repo "$GITHUB_REPOSITORY" --body "$(cat $RUNNER_TEMP/last_check)"; fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
